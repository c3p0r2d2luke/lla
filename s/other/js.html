<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>js-dos File Player</title>

  <link
    rel="stylesheet"
    href="https://v8.js-dos.com/latest/js-dos.css"
  />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #dos {
      width: 100vw;
      height: 100vh;
    }

    #upload-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .upload-box {
      width: min(90%, 420px);
      padding: 32px;
      color: white;
      text-align: center;
      border: 2px dashed #777;
      border-radius: 16px;
      background: #1d1d1d;
    }

    .upload-box h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .upload-box p {
      color: #bbb;
    }

    .upload-button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      color: #fff;
      cursor: pointer;
      border-radius: 8px;
      background: #2563eb;
    }

    .upload-button:hover {
      background: #1d4ed8;
    }

    #file-input {
      display: none;
    }

    #error {
      margin-top: 16px;
      color: #ff6b6b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="upload-screen">
    <div class="upload-box">
      <h1>Load a DOS Game</h1>
      <p>Select a <code>.jsdos</code> file to launch it.</p>

      <label class="upload-button" for="file-input">
        Choose .jsdos File
      </label>

      <input
        id="file-input"
        type="file"
        accept=".jsdos,application/zip"
      />

      <div id="error"></div>
    </div>
  </div>

  <div id="dos"></div>

  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <script>
    const fileInput = document.getElementById("file-input");
    const uploadScreen = document.getElementById("upload-screen");
    const errorMessage = document.getElementById("error");

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];

      if (!file) {
        return;
      }

      if (!file.name.toLowerCase().endsWith(".jsdos")) {
        errorMessage.textContent = "Please select a valid .jsdos file.";
        return;
      }

      try {
        const fileUrl = URL.createObjectURL(file);

        uploadScreen.style.display = "none";

        Dos(document.getElementById("dos"), {
          url: fileUrl
        });
      } catch (error) {
        uploadScreen.style.display = "flex";
        errorMessage.textContent =
          "The file could not be loaded: " + error.message;
      }
    });
  </script>
</body>
</html>
